<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<title>Sistema Alysson</title>
<style>
*{box-sizing:border-box}
:root{--bg:#050814;--card:#0d1427;--card2:#080f20;--line:#293857;--text:#f4f7ff;--muted:#91a0bf;--violet:#8b5cf6;--cyan:#55d6ff;--glow:#7c3aed}
body{margin:0;background:radial-gradient(circle at 50% -10%,#162448 0,#090d1b 34%,#050814 70%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:linear-gradient(90deg,transparent 49.7%,#55d6ff18 50%,transparent 50.3%),linear-gradient(0deg,transparent 49.7%,#8b5cf610 50%,transparent 50.3%);background-size:44px 44px}
.app{max-width:520px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px calc(42px + env(safe-area-inset-bottom));position:relative}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
h1{font-size:27px;margin:2px 0 0;letter-spacing:-.4px;text-shadow:0 0 22px #8b5cf633}
.sub{color:#8ea5cf;font-size:11px;letter-spacing:1.7px}.systemStatus{font-size:9px;color:var(--cyan);letter-spacing:1.5px;margin-bottom:4px}
.card{background:linear-gradient(145deg,#111a31ee,#0b1225ee);border:1px solid #304264;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 12px 28px #0007,inset 0 1px 0 #ffffff08;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;width:44px;height:1px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.level{font-size:22px;font-weight:850}.xp{margin-top:12px;height:11px;background:#202b43;border:1px solid #31405f;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:20px;box-shadow:0 0 14px #55d6ff88;transition:width .35s ease}
.row{display:flex;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.attr{background:linear-gradient(145deg,#091020,#0a1122);border:1px solid #17233d;padding:13px;border-radius:14px;min-height:116px}.attr b{display:block;font-size:19px;margin-top:4px}.attrProgress{margin-top:10px;height:7px;background:#202b43;border-radius:20px;overflow:hidden}.attrBar{height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:20px;box-shadow:0 0 10px #8b5cf666;transition:width .35s ease}.attrMeta{margin-top:6px;font-size:11px;color:#9aaccc}
.mission{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #273550}.mission:last-child{border:0}.mission input{width:22px;height:22px;accent-color:var(--violet);flex:0 0 auto}.missionMain{flex:1;min-width:0}.missionTitle{font-size:15px}.missionMeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.tag{font-size:10px;padding:3px 7px;border:1px solid #344568;border-radius:999px;color:#aebddd;background:#0a1120}.tag.pd{border-color:#4d3e78;color:#c7b6ff}.tag.xpTag{border-color:#2b5665;color:#88e8ff}.done{text-decoration:line-through;color:#66738d}
.btn{width:100%;border:1px solid #8157ff;border-radius:13px;padding:13px;background:linear-gradient(90deg,#6f44e8,#8b5cf6);color:white;font-weight:850;font-size:15px;margin-top:10px;box-shadow:0 0 18px #8b5cf633}.danger{background:#202a42;border-color:#31405f;box-shadow:none;color:#d8deec}.small{font-size:12px;color:var(--muted)}.rank{font-weight:900;color:#ccb9ff;border:1px solid #654e9a;background:#171128;padding:7px 10px;border-radius:10px;box-shadow:0 0 18px #8b5cf62b}.next{font-size:11px;color:#8ea0c4;margin-top:5px}.sectionTitle{font-size:17px;font-weight:850}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translate(-50%,-20px);width:min(88vw,430px);padding:13px 15px;border:1px solid #4c6b9d;background:#091224ee;backdrop-filter:blur(12px);border-radius:12px;box-shadow:0 0 30px #55d6ff33;opacity:0;pointer-events:none;transition:.25s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}.toast .t1{font-size:10px;letter-spacing:1.8px;color:var(--cyan);margin-bottom:3px}.toast .t2{font-weight:800}
@media(max-width:370px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.rank{font-size:13px}}
</style>
</head>
<body><div class="toast" id="toast"><div class="t1">[ SISTEMA ]</div><div class="t2" id="toastText"></div></div><main class="app">
<div class="top"><div><div class="systemStatus">● SYSTEM ONLINE</div><div class="sub">SISTEMA DE EVOLUÇÃO PESSOAL</div><h1>⚔️ Sistema Alysson</h1></div><div class="rank" id="rank">RANK E</div></div>

<section class="card">
<div class="row"><div><div class="level" id="level">Nível 1</div><div class="small" id="xpText">0 / 100 XP</div><div class="next" id="nextText">100 XP para o próximo nível</div></div><div style="text-align:right">🏆 <b id="total">0</b><div class="small">XP total</div></div></div>
<div class="xp"><div class="bar" id="bar"></div></div>
</section>

<section class="card"><div class="row"><b class="sectionTitle">🧬 Atributos</b><span class="small">evolução real</span></div><div class="grid" id="attrs"></div></section>

<section class="card"><div class="row"><b class="sectionTitle">🎯 Missões de hoje</b><span class="small">XP + PD</span></div><div id="missions"></div>
<button class="btn" onclick="addMission()">+ Adicionar missão</button></section>

<section class="card"><div class="row"><b>🔥 Sequência</b><b id="streak">0 dias</b></div><div class="small" style="margin-top:6px">A sequência aumenta quando você conclui pelo menos uma missão em um dia.</div></section>

<button class="btn danger" onclick="resetSystem()">Reiniciar progresso</button>
</main>
<script>
const officialAttributes=["Disciplina","Físico","Intelecto","Comunicação","Foco","Relacionamento","Organização"];
const defaultData={xp:0,streak:0,lastDay:null,attrs:{
Disciplina:{level:1,pd:0},
"Físico":{level:1,pd:0},
Intelecto:{level:1,pd:0},
"Comunicação":{level:1,pd:0},
Foco:{level:1,pd:0},
Relacionamento:{level:1,pd:0},
"Organização":{level:1,pd:0}
},missions:[
{name:"Treino",xp:20,pd:5,attr:"Físico",difficulty:"Normal",done:false},
{name:"Estudo",xp:20,pd:5,attr:"Intelecto",difficulty:"Normal",done:false},
{name:"Revisão de memória",xp:15,pd:3,attr:"Intelecto",difficulty:"Simples",done:false},
{name:"Prática de comunicação",xp:15,pd:5,attr:"Comunicação",difficulty:"Normal",done:false},
{name:"Missão de disciplina",xp:15,pd:5,attr:"Disciplina",difficulty:"Normal",done:false}]};

let data=JSON.parse(localStorage.getItem("alyssonSystem")||"null")||structuredClone(defaultData);

function migrateData(){
 if(!data || typeof data!=="object") data=structuredClone(defaultData);
 if(typeof data.xp!=="number") data.xp=0;
 if(typeof data.streak!=="number") data.streak=0;
 if(!Array.isArray(data.missions)) data.missions=structuredClone(defaultData.missions);
 const missionRules={
  "Treino":{attr:"Físico",pd:5,difficulty:"Normal"},
  "Estudo":{attr:"Intelecto",pd:5,difficulty:"Normal"},
  "Revisão de memória":{attr:"Intelecto",pd:3,difficulty:"Simples"},
  "Prática de comunicação":{attr:"Comunicação",pd:5,difficulty:"Normal"},
  "Missão de disciplina":{attr:"Disciplina",pd:5,difficulty:"Normal"}
 };
 data.missions=data.missions.map(m=>{
  const rule=missionRules[m.name]||{};
  return {...m,attr:m.attr||rule.attr||null,pd:Number.isFinite(m.pd)?m.pd:(rule.pd||0),difficulty:m.difficulty||rule.difficulty||"Personalizada"};
 });

 const old=data.attrs&&typeof data.attrs==="object"?data.attrs:{};
 const readLevel=(name)=>{
  const value=old[name];
  if(typeof value==="number") return Math.max(1,Math.floor(value));
  if(value&&typeof value==="object"&&typeof value.level==="number") return Math.max(1,Math.floor(value.level));
  return 1;
 };
 const readPd=(name)=>{
  const value=old[name];
  if(value&&typeof value==="object"&&typeof value.pd==="number") return Math.max(0,Math.min(99,Math.floor(value.pd)));
  return 0;
 };

 const conhecimento=Math.max(readLevel("Conhecimento"),readLevel("Inteligência"),readLevel("Intelecto"));
 data.attrs={
  Disciplina:{level:readLevel("Disciplina"),pd:readPd("Disciplina")},
  "Físico":{level:readLevel("Físico"),pd:readPd("Físico")},
  Intelecto:{level:conhecimento,pd:readPd("Intelecto")},
  "Comunicação":{level:readLevel("Comunicação"),pd:readPd("Comunicação")},
  Foco:{level:readLevel("Foco"),pd:readPd("Foco")},
  Relacionamento:{level:readLevel("Relacionamento"),pd:readPd("Relacionamento")},
  "Organização":{level:readLevel("Organização"),pd:readPd("Organização")}
 };
 localStorage.setItem("alyssonSystem",JSON.stringify(data));
}
migrateData();

function save(){localStorage.setItem("alyssonSystem",JSON.stringify(data));render()}
function levelInfo(){
 let xp=Math.max(0,Number(data.xp)||0);
 let level=Math.floor(Math.sqrt(xp/100))+1;
 let currentLevelXP=100*Math.pow(level-1,2);
 let nextLevelXP=100*Math.pow(level,2);
 let cur=xp-currentLevelXP;
 let needed=nextLevelXP-currentLevelXP;
 let percent=needed>0?(cur/needed)*100:0;
 return {level,cur,needed,percent,nextLevelXP}
}
function rank(l){
 return l>=75?"SSS":l>=50?"SS":l>=40?"S":l>=30?"A":l>=20?"B":l>=10?"C":l>=5?"D":"E";
}
function render(){
 let i=levelInfo();
 document.getElementById("level").textContent="Nível "+i.level;
 document.getElementById("xpText").textContent=i.cur+" / "+i.needed+" XP";
 document.getElementById("total").textContent=data.xp;document.getElementById("nextText").textContent=(i.needed-i.cur)+" XP para o próximo nível";
 document.getElementById("bar").style.width=Math.min(100,i.percent)+"%";
 document.getElementById("rank").textContent="RANK "+rank(i.level);
 document.getElementById("streak").textContent=data.streak+" "+(data.streak==1?"dia":"dias");
 document.getElementById("attrs").innerHTML=officialAttributes.map(name=>{
 const a=data.attrs[name]||{level:1,pd:0};
 const pd=Math.max(0,Math.min(99,Number(a.pd)||0));
 return `<div class="attr"><span class="small">${name}</span><b>Lv. ${a.level}</b><div class="attrProgress"><div class="attrBar" style="width:${pd}%"></div></div><div class="attrMeta">${pd} / 100 PD</div></div>`;
}).join("");
 document.getElementById("missions").innerHTML=data.missions.map((m,n)=>`<label class="mission">
 <input type="checkbox" ${m.done?"checked":""} onchange="toggle(${n})">
 <div class="missionMain ${m.done?"done":""}">
  <div class="missionTitle">${m.name}</div>
  <div class="missionMeta">
   <span class="tag xpTag">+${m.xp} XP</span>
   ${m.attr&&m.pd?`<span class="tag pd">+${m.pd} PD · ${m.attr}</span>`:""}
   <span class="tag">${m.difficulty||"Missão"}</span>
  </div>
 </div>
</label>`).join("");
}
function showToast(text){
 const toast=document.getElementById("toast");
 document.getElementById("toastText").textContent=text;
 toast.classList.add("show");
 clearTimeout(window.__toastTimer);
 window.__toastTimer=setTimeout(()=>toast.classList.remove("show"),2200);
}
function toggle(n){
 let m=data.missions[n];
 if(m.done)return;
 m.done=true;
 data.xp+=Number(m.xp)||0;
 if(m.attr&&data.attrs[m.attr]&&m.pd){
  data.attrs[m.attr].pd=Math.min(99,(Number(data.attrs[m.attr].pd)||0)+(Number(m.pd)||0));
 }
 const today=new Date().toDateString();
 if(data.lastDay!==today){data.streak++;data.lastDay=today}
 save();
 showToast(`MISSÃO CONCLUÍDA · +${m.xp} XP${m.attr&&m.pd?` · +${m.pd} PD ${m.attr}`:""}`);
}
function addMission(){
 const name=prompt("Nome da missão:");
 if(!name)return;
 const menu=officialAttributes.map((a,i)=>`${i+1}. ${a}`).join("\n");
 const chosen=parseInt(prompt("Atributo relacionado:\n"+menu+"\n\nDigite o número:")||"0",10);
 const attr=officialAttributes[chosen-1]||null;
 const diff=parseInt(prompt("Dificuldade:\n1. Microação\n2. Simples\n3. Normal\n4. Difícil\n\nDigite o número:")||"2",10);
 const rewards={1:{xp:5,pd:1,name:"Microação"},2:{xp:10,pd:3,name:"Simples"},3:{xp:15,pd:5,name:"Normal"},4:{xp:25,pd:8,name:"Difícil"}};
 const r=rewards[diff]||rewards[2];
 data.missions.push({name,xp:r.xp,pd:attr?r.pd:0,attr,difficulty:r.name,done:false});
 save();
 showToast("NOVA MISSÃO REGISTRADA");
}
function resetSystem(){if(confirm("Reiniciar todo o progresso?")){localStorage.removeItem("alyssonSystem");location.reload()}}
render();
</script></body></html>
